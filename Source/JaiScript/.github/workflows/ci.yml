name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Three compilers x two configurations. Every cell builds the library, the suite, the
  # fuzzer, the runner and the example games, then runs the suite on both backends, a
  # short differential-fuzz run and the games' deterministic hash checks. The gate
  # logic lives in tools/ci/gates.sh so any step can be reproduced locally.
  build:
    name: ${{ matrix.name }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        name: [windows-msvc, linux-gcc, linux-clang]
        config: [Debug, Release]
        include:
          - name: windows-msvc
            os: windows-latest
            cxx: cl
          - name: linux-gcc
            os: ubuntu-24.04
            cxx: g++-14
          - name: linux-clang
            os: ubuntu-24.04
            cxx: clang++
    defaults:
      run:
        shell: bash
    env:
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v4

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}-${{ matrix.config }}
          max-size: 1G

      # Embedded (/Z7) debug info on MSVC Debug: ccache cannot cache /Zi's shared PDB.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
          '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=$<$<CONFIG:Debug>:Embedded>'

      - name: Build
        run: cmake --build build --target jaiscript_tests jaiscript_fuzz jaiscript_runner jaiscript_lsp jai_gloom jai_crawler jai_demoreel embed_quickstart jai_spider

      - name: Tests (interpreter)
        run: bash tools/ci/gates.sh tests-interp

      - name: Tests (vm)
        run: bash tools/ci/gates.sh tests-vm

      - name: Tests (vm reference)
        run: bash tools/ci/gates.sh tests-vm-reference

      - name: Differential fuzz smoke
        run: bash tools/ci/gates.sh fuzz

      - name: VM reference fuzz smoke
        run: bash tools/ci/gates.sh fuzz-vm-reference

      - name: Ordering fuzz
        run: bash tools/ci/gates.sh fuzz-order

      - name: GLOOM hash gate
        run: bash tools/ci/gates.sh gloom

      - name: crawler hash gate
        run: bash tools/ci/gates.sh crawler

      - name: Embedding quickstart
        run: bash tools/ci/gates.sh embed-quickstart

      - name: Language server tests
        run: bash tools/ci/gates.sh lsp

      - name: Web host and HTTP client
        run: bash tools/ci/gates.sh spider

      - name: Runner selftest
        run: bash tools/ci/gates.sh selftest

      # Release only: every sample on the site runs on both backends.
      - name: Documentation site
        if: matrix.config == 'Release'
        run: bash tools/ci/gates.sh site

      # Release only: in a Debug build these two runs take tens of minutes.
      - name: demoreel hash gate
        if: matrix.config == 'Release'
        run: bash tools/ci/gates.sh demoreel

      - name: Gator Quest hash gate
        if: matrix.config == 'Release'
        run: bash tools/ci/gates.sh gatorquest

      # Release only: it holds a wall-clock budget (median edit-to-diagnostics under 100 ms).
      - name: Language server latency
        if: matrix.config == 'Release'
        run: bash tools/ci/gates.sh lsp-latency

  # AddressSanitizer and UndefinedBehaviorSanitizer: the suites on both backends and a short
  # differential fuzz run in a Debug build of their own (tools/ci/gates.sh asan).
  sanitizers:
    name: linux-clang asan+ubsan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: ASan + UBSan suites and fuzz
        run: bash tools/ci/gates.sh asan

  # Cheap conformance gate: catches MSVC-isms and missing standard includes
  # without waiting for the full matrix.
  syntax-sweep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: g++ -fsyntax-only sweep
        run: |
          fails=0
          for f in $(find source/implementation -name '*.cpp' | sort); do
            g++-14 -std=c++20 -fsyntax-only -Iinclude -Isource "$f" || fails=$((fails+1))
          done
          exit $fails
      - name: Public headers alone and warning-free
        run: HEADER_CXX=g++-14 bash tools/ci/gates.sh headers && HEADER_CXX=clang++ bash tools/ci/gates.sh headers
