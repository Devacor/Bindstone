# JaiScript CI — becomes active when this directory is extracted into its own repository
# (GitHub only runs workflows from the repository root's .github/).
name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release --target jaiscript_tests
      - name: Test
        run: build/bin/Release/jaiscript_tests.exe

  linux-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14
      - name: Build
        run: cmake --build build --target jaiscript_tests
      - name: Test
        run: ./build/bin/jaiscript_tests

  linux-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build --target jaiscript_tests
      - name: Test
        run: ./build/bin/jaiscript_tests

  # Cheap conformance gate: catches MSVC-isms and missing standard includes
  # without waiting for the full matrix.
  syntax-sweep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: g++ -fsyntax-only sweep
        run: |
          fails=0
          for f in source/implementation/*.cpp; do
            g++-14 -std=c++20 -fsyntax-only -Iinclude "$f" || fails=$((fails+1))
          done
          exit $fails
