apply plugin: 'com.android.application'

android {
    namespace = "com.snapjaw.bindstone"
    compileSdkVersion = 35

    defaultConfig.with {
        applicationId = "com.snapjaw.bindstone"
        minSdkVersion = 21
        targetSdkVersion = 23
        multiDexEnabled true
    }
    
    compileOptions.with {
        sourceCompatibility=JavaVersion.VERSION_1_8
        targetCompatibility=JavaVersion.VERSION_1_8
    }

    signingConfigs {
        releaseSigningConfig {
            storeFile rootProject.file("../../../Certificates/BindstoneKeyStore.jks")
            storePassword "***REMOVED***"
            keyAlias "bindstone"
            keyPassword "***REMOVED***"
        }
    }

    buildTypes {
        release {
            debuggable = false
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.releaseSigningConfig
        }
        debug {
            debuggable = true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules-debug.pro'
        }
    }


    flavorDimensions "default"
    productFlavors {
	    create("arm7") {
            ndk.abiFilters 'armeabi-v7a', 'armeabi'
        }
        create("arm8") {
            ndk.abiFilters 'arm64-v8a'
        }
		create("x86") {
           ndk.abiFilters 'x86'
        }
        create("x86-64") {
            ndk.abiFilters 'x86_64'
        }
        create("all")
    }

    lint {
        // targetSdkVersion stays at 23 until it is raised on purpose
        disable 'ExpiredTargetSdkVersion'
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../../../Assets']
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    
}